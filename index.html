<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매물대장</title>
<meta name="theme-color" content="#1F5A7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#F2F4F1; --sheet:#FFFFFF; --ink:#1C2A33; --muted:#5D6B72; --line:#CBD3CE;
  --survey:#1F5A7A; --survey-soft:#E1ECF2; --parcel:#B5382F; --land:#55753A; --hold:#9A7A1E; --done:#7B868C; --right:#6B4FA0;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151B1F; --sheet:#1D252A; --ink:#E4EAEC; --muted:#9AA8AE; --line:#34424A;
    --survey:#6FAED0; --survey-soft:#1F3442; --parcel:#E2766C; --land:#8DB86A; --hold:#D6B354; --done:#8A969C; --right:#B39BE0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151B1F; --sheet:#1D252A; --ink:#E4EAEC; --muted:#9AA8AE; --line:#34424A;
  --survey:#6FAED0; --survey-soft:#1F3442; --parcel:#E2766C; --land:#8DB86A; --hold:#D6B354; --done:#8A969C; --right:#B39BE0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--survey);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(330px,430px) 1fr;height:100%}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--sheet)}
header.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
header.top .sync{font-size:12px;color:var(--muted);text-align:right}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--sheet)}
.search{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select,.row input{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);min-width:0}
.row input.num{width:84px}
.row .lbl{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--survey);color:var(--sheet)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);align-items:center}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn.primary{background:var(--survey);border-color:var(--survey);color:var(--sheet);font-weight:500}
.btn.danger{color:var(--parcel);border-color:var(--parcel)}
.btn.small{padding:3px 9px;font-size:13px}
.btn[aria-pressed=true]{background:var(--survey-soft);border-color:var(--survey)}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
.list{overflow-y:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:3px solid transparent;width:100%;text-align:left;border-top:0;border-right:0}
.item[aria-current=true]{background:var(--survey-soft);border-left-color:var(--survey)}
.mark{width:40px;height:40px;border:2px solid var(--parcel);display:grid;place-items:center;font-weight:700;color:var(--parcel);font-size:17px;position:relative;background:var(--sheet)}
.mark.multi{box-shadow:4px 4px 0 -1px var(--sheet),4px 4px 0 1px var(--parcel)}
.mark.kwon{border-color:var(--right);color:var(--right);border-radius:50%}
.mark small{position:absolute;bottom:-1px;right:2px;font-size:9px;font-weight:500;color:var(--muted)}
.item .addr{font-weight:500}
.item .meta{font-size:13px;color:var(--muted)}
.item .price{font-weight:700;text-align:right;white-space:nowrap}
.item .price span{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:999px;border:1px solid currentColor;margin-right:5px;line-height:1.6}
.st-진행{color:var(--land)} .st-보류{color:var(--hold)} .st-완료{color:var(--done)} .tg-co{color:var(--survey)}
.chip{display:none;align-items:center;gap:6px;font-size:13px;background:var(--survey-soft);border:1px solid var(--survey);border-radius:999px;padding:2px 4px 2px 10px;width:fit-content}
.chip.on{display:inline-flex}
.chip button{border:0;background:transparent;cursor:pointer;padding:0 6px;font-size:15px;line-height:1}
.empty{padding:40px 24px;color:var(--muted);text-align:center}
.right{overflow-y:auto;min-height:0;padding:22px clamp(16px,3vw,40px)}
.detail{max-width:900px}
.dhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.dhead .mark{width:58px;height:58px;font-size:26px;flex:none}
.dhead h2{margin:0;font-size:22px;line-height:1.3}
.sub{color:var(--muted);font-size:14px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:6px;background:var(--sheet);margin-bottom:18px}
.figs div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:-1px}
.figs b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.figs small{color:var(--muted);font-size:12px}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
h3{font-size:16px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
dl.spec{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
dl.spec dt{color:var(--muted);font-size:14px} dl.spec dd{margin:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px;background:var(--paper)}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
tbody tr.go{cursor:pointer}
tbody tr.go:hover{background:var(--survey-soft)}
.log{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.log li{position:relative;padding:4px 0 14px 18px}
.log li::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--survey)}
.log .when{font-size:13px;color:var(--muted)}
.log .txt{white-space:pre-wrap}
.log .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 4px}
.addlog{display:grid;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:6px}
.addlog textarea{min-height:70px;resize:vertical;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.addlog input{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.sibs{display:grid;gap:6px}
.sibs button{text-align:left}
.placeholder{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center}
.placeholder svg{width:160px;height:auto;margin-bottom:14px;opacity:.8}
dialog{border:1px solid var(--line);border-radius:8px;padding:0;background:var(--sheet);color:var(--ink);width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,20,25,.45)}
form.edit{padding:20px;display:grid;gap:14px;overflow-y:auto;max-height:92vh}
form.edit h2{margin:0;font-size:19px}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 14px 14px;margin:0}
fieldset[hidden]{display:none}
legend{padding:0 6px;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.grid label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.grid input,.grid select,.grid textarea,.prow input,.prow select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:15px;min-width:0}
.grid .wide{grid-column:1/-1}
.conv{font-size:12px;color:var(--survey)}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.prow{display:grid;grid-template-columns:1.3fr 1fr 1.1fr .9fr .9fr auto;gap:6px;align-items:center;margin-bottom:6px}
.prow .rm{border:0;background:none;color:var(--parcel);cursor:pointer;font-size:18px;width:28px}
.prow .first{font-size:12px;color:var(--muted);width:28px;text-align:center}
.phead{font-size:12px;color:var(--muted)}
.psum{font-size:13px;color:var(--survey);margin-top:4px}
.actions{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.toast.on{opacity:1}
.back{display:none}
.auth{display:flex;align-items:center;gap:8px}
.mapwrap{position:relative;height:calc(100% - 60px);min-height:420px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#bigMap{position:absolute;inset:0}
.minimap{height:260px;border:1px solid var(--line);border-radius:6px;margin-bottom:22px;overflow:hidden}
.pin{background:var(--sheet);color:var(--ink);border:2px solid var(--parcel);border-radius:4px;padding:2px 7px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pin.kwon{border-color:var(--right)}
.mapnote{font-size:13px;color:var(--muted);margin:6px 0 0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .right{display:none}
  .app.show-detail .left{display:none}
  .app.show-detail .right{display:block}
  .back{display:inline-block;margin-bottom:12px}
  .prow{grid-template-columns:1fr 1fr auto;}
  .phead{display:none!important}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="left">
    <header class="top">
      <h1>매물대장</h1>
      <span class="auth"><span class="sync" id="sync">이 기기에 저장</span><button class="btn small" id="authBtn" type="button">구글 로그인</button></span>
    </header>
    <div class="search">
      <input type="search" id="q" placeholder="지번, 소재지, 소유자, 전화번호, 중개사무소, 메모" aria-label="검색어">
      <span class="chip" id="regionChip"><span id="regionTxt"></span><button type="button" id="regionClr" aria-label="지역 조건 지우기">×</button></span>
      <div class="row">
        <select id="fType" aria-label="매물 유형"><option value="">유형 전체</option><option>토지</option><option>공장</option><option>창고</option><option>이축권</option></select>
        <select id="fJimok" aria-label="지목"><option value="">지목 전체</option></select>
        <select id="fState" aria-label="진행 상태"><option value="">상태 전체</option><option>진행</option><option>보류</option><option>완료</option></select>
        <select id="fDeal" aria-label="거래 구분"><option value="">매매·임대 전체</option><option value="sale">매매가 있음</option><option value="rent">임대가 있음</option></select>
        <select id="fSrc" aria-label="매물 출처"><option value="">출처 전체</option><option value="own">직접 매물</option><option value="co">공동중개</option></select>
      </div>
      <div class="row">
        <span class="lbl">토지면적</span>
        <input class="num" id="aMin" type="number" inputmode="decimal" placeholder="최소" aria-label="최소 면적">
        <span class="lbl">~</span>
        <input class="num" id="aMax" type="number" inputmode="decimal" placeholder="최대" aria-label="최대 면적">
        <span class="seg" role="group" aria-label="면적 단위">
          <button type="button" data-unit="py" aria-pressed="true">평</button>
          <button type="button" data-unit="m2" aria-pressed="false">㎡</button>
        </span>
      </div>
      <div class="row">
        <span class="lbl">매매가(만원)</span>
        <input class="num" id="pMin" type="number" inputmode="numeric" placeholder="최소" aria-label="최소 가격">
        <span class="lbl">~</span>
        <input class="num" id="pMax" type="number" inputmode="numeric" placeholder="최대" aria-label="최대 가격">
        <button class="btn" id="reset" type="button">조건 지우기</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="addBtn" type="button">매물 등록</button>
      <button class="btn" id="sumBtn" type="button" aria-pressed="false">지역별 요약</button>
      <button class="btn" id="mapBtn" type="button" aria-pressed="false" hidden>지도</button>
      <button class="btn" id="impBtn" type="button">엑셀 불러오기</button>
      <button class="btn" id="expBtn" type="button">엑셀 저장</button>
      <input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list" role="list"></div>
  </section>
  <main class="right" id="right"></main>
</div>

<dialog id="dlg">
  <form class="edit" id="form" method="dialog">
    <h2 id="formTitle">매물 등록</h2>
    <fieldset><legend>기본 정보</legend>
      <div class="grid">
        <label>유형<select name="type"><option>토지</option><option>공장</option><option>창고</option><option>이축권</option></select></label>
        <label>상태<select name="state"><option>진행</option><option>보류</option><option>완료</option></select></label>
        <label>용도지역<input name="zone" placeholder="일반공업지역" list="zones"></label>
        <label class="wide">소재지 (시·군·구 읍·면·동)<input name="area" placeholder="경기도 안산시 단원구 원시동" required></label>
      </div>
    </fieldset>
    <fieldset><legend id="parcelLegend">필지·건물</legend>
      <p class="hint" id="parcelHint">같은 소유자의 여러 필지·건물을 한 매물로 묶어 일괄 가격으로 관리하려면 ‘필지 추가’를 누르세요. 첫 줄이 대표 필지입니다.</p>
      <div class="prow phead"><span>지번</span><span>지목</span><span>토지(㎡)</span><span>건물(㎡)</span><span>소재지(다를 때만)</span><span></span></div>
      <div id="prows"></div>
      <button class="btn small" type="button" id="addParcel">필지 추가</button>
      <div class="psum" id="psum"></div>
    </fieldset>
    <fieldset><legend>가격</legend>
      <div class="grid">
        <label><span id="priceLbl">매매가(만원)</span><input name="price" type="number" inputmode="numeric"><span class="conv" data-conv="price"></span></label>
        <label>임대 보증금(만원)<input name="deposit" type="number" inputmode="numeric"><span class="conv" data-conv="deposit"></span></label>
        <label>월 임대료(만원)<input name="rent" type="number" inputmode="numeric"><span class="conv" data-conv="rent"></span></label>
      </div>
    </fieldset>
    <fieldset id="factoryBox"><legend>공장·창고 시설</legend>
      <div class="grid">
        <label>층고(m)<input name="height" type="number" step="any"></label>
        <label>호이스트<input name="hoist" placeholder="5톤 2대"></label>
        <label>수전용량(kW)<input name="power" type="number" step="any"></label>
        <label>진입로 폭(m)<input name="road" type="number" step="any"></label>
        <label>대형차 진입<select name="truck"><option value="">미확인</option><option>가능</option><option>불가</option></select></label>
        <label>공장등록<select name="reg"><option value="">미확인</option><option>가능</option><option>불가</option><option>등록됨</option></select></label>
      </div>
    </fieldset>
    <fieldset><legend>매물 출처</legend>
      <div class="grid">
        <label>출처<select name="src"><option value="own">직접 매물 (소유자 직접 의뢰)</option><option value="co">타 중개사무소 매물 (공동중개)</option></select></label>
        <label class="coOnly">부동산명<input name="agName" placeholder="○○공인중개사사무소"></label>
        <label class="coOnly">부동산 전화번호<input name="agPhone" type="tel" placeholder="031-000-0000"></label>
      </div>
    </fieldset>
    <fieldset><legend>소유자</legend>
      <div class="grid">
        <label>소유자명<input name="owner"></label>
        <label>소유자 전화번호<input name="phone" type="tel" placeholder="010-0000-0000"></label>
        <label class="wide">메모<textarea name="memo" rows="2"></textarea></label>
      </div>
    </fieldset>
    <div class="actions">
      <button class="btn" type="button" id="cancelBtn">취소</button>
      <button class="btn primary" type="submit" id="saveBtn">저장</button>
    </div>
  </form>
</dialog>
<datalist id="zones">
  <option>제1종일반주거지역</option><option>제2종일반주거지역</option><option>준주거지역</option><option>일반상업지역</option>
  <option>전용공업지역</option><option>일반공업지역</option><option>준공업지역</option>
  <option>보전녹지지역</option><option>생산녹지지역</option><option>자연녹지지역</option>
  <option>보전관리지역</option><option>생산관리지역</option><option>계획관리지역</option>
  <option>농림지역</option><option>자연환경보전지역</option><option>개발제한구역</option>
</datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// 공간정보관리법 제67조의 28개 지목과 지적도 부호
const JIMOK = [["전","전"],["답","답"],["과수원","과"],["목장용지","목"],["임야","임"],["광천지","광"],["염전","염"],["대","대"],["공장용지","장"],["학교용지","학"],["주차장","차"],["주유소용지","주"],["창고용지","창"],["도로","도"],["철도용지","철"],["제방","제"],["하천","천"],["구거","구"],["유지","유"],["양어장","양"],["수도용지","수"],["공원","공"],["체육용지","체"],["유원지","원"],["종교용지","종"],["사적지","사"],["묘지","묘"],["잡종지","잡"]];
const SYMBOL = Object.fromEntries(JIMOK);

const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;

const parcels = it => [{ area: "", jibun: it.jibun, jimok: it.jimok, landM2: it.landM2, bldgM2: it.bldgM2 }, ...(it.extra || [])];
const sum = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
const totLand = it => sum(parcels(it).map(p => p.landM2));
const totBldg = it => sum(parcels(it).map(p => p.bldgM2));
const isMulti = it => (it.extra || []).length > 0;
const markOf = it => it.type === "이축권" ? "권" : (SYMBOL[it.jimok] || "?");
const rentTxt = it => (it.deposit != null || it.rent != null) ? `보증금 ${it.deposit != null ? fmt(it.deposit) + "만" : "–"} / 월 ${it.rent != null ? fmt(it.rent) + "만" : "–"}` : "";
const titleOf = it => `${it.area} ${it.jibun}${isMulti(it) ? ` 외 ${it.extra.length}필지` : ""}`;
function regionKey(area, level){
  const t = String(area || "").trim().split(/\s+/).filter(Boolean);
  if (!t.length) return "(소재지 없음)";
  if (level === "dong") return t.join(" ");
  // 시·군·구 단위: 마지막 읍·면·동·리를 뗀다
  let end = t.length;
  while (end > 1 && /(읍|면|동|리|가)$/.test(t[end - 1])) end--;
  return t.slice(0, end).join(" ");
}

/* ---------- 저장: 이 기기(오프라인 보관) + 구글 드라이브 ---------- */
const LKEY = "maemul-app-v2", FILE = "매물대장_데이터.json";
const DRIVE = "https://www.googleapis.com/drive/v3", UPLOAD = "https://www.googleapis.com/upload/drive/v3";
let all = [], fileId = null, rev = 0, syncedRev = 0, token = null, tokenExp = 0, tokenClient = null, syncing = false, syncTimer = null, lastSync = null;
const live = () => { items = all.filter(x => !x.deleted); };
function loadLocal(){
  try { const d = JSON.parse(localStorage.getItem(LKEY) || "{}"); all = d.all || []; fileId = d.fileId || null; rev = d.rev || 0; syncedRev = d.syncedRev || 0; lastSync = d.lastSync || null; } catch { all = []; }
  live();
}
function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify({ all, fileId, rev, syncedRev, lastSync })); } catch { toast("이 기기 저장 공간이 부족합니다. 엑셀로 백업하세요"); } }
function upsert(it){ const i = all.findIndex(x => x.id === it.id); i < 0 ? all.push(it) : all[i] = it; }
function afterChange(){ rev++; live(); saveLocal(); render(); scheduleSync(); setSync(); }
function removeItem(id){ upsert({ id, deleted: true, updated: Date.now() }); afterChange(); }
async function save(it){ it.updated = Date.now(); upsert(it); afterChange(); }
function setSync(msg){
  const pend = rev !== syncedRev;
  if (!CONFIG.GOOGLE_CLIENT_ID) { $("#authBtn").hidden = true; $("#sync").textContent = "이 기기에만 저장 (드라이브 미설정)"; return; }
  $("#sync").textContent = msg || (token ? (pend ? "드라이브에 저장 대기 중" : `드라이브 저장됨${lastSync ? " " + new Date(lastSync).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : ""}`)
    : (pend ? "이 기기에만 저장됨 · 로그인하면 드라이브에 저장" : "이 기기에 저장"));
  $("#authBtn").textContent = token ? "동기화" : (localStorage.getItem("maemul-signed") ? "드라이브 연결" : "구글 로그인");
}
function scheduleSync(){ clearTimeout(syncTimer); if (token) syncTimer = setTimeout(sync, 1500); }

function initGoogle(){
  if (!CONFIG.GOOGLE_CLIENT_ID) { $("#authBtn").hidden = true; setSync("드라이브 미설정 · 이 기기에만 저장"); return; }
  if (!window.google?.accounts?.oauth2) { setTimeout(initGoogle, 400); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/drive.file",
    callback: r => {
      if (r.error) { setSync("로그인하지 못했습니다"); return; }
      token = r.access_token; tokenExp = Date.now() + (r.expires_in - 60) * 1000;
      localStorage.setItem("maemul-signed", "1"); sync();
    }
  });
}
function login(){
  if (!tokenClient) { toast("구글 로그인 준비 중입니다. 잠시 후 다시 누르세요"); return; }
  if (token && Date.now() < tokenExp) { sync(); return; }
  tokenClient.requestAccessToken({ prompt: localStorage.getItem("maemul-signed") ? "" : "consent" });
}
async function gfetch(url, opt = {}){
  if (!token || Date.now() > tokenExp) { token = null; throw { auth: true }; }
  const r = await fetch(url, { ...opt, headers: { Authorization: "Bearer " + token, ...(opt.headers || {}) } });
  if (r.status === 401) { token = null; throw { auth: true }; }
  if (r.status === 404) throw { notFound: true };
  if (!r.ok) throw new Error(`드라이브 오류 ${r.status}`);
  return r;
}
async function findFile(){
  const q = encodeURIComponent(`name='${FILE}' and trashed=false`);
  const j = await (await gfetch(`${DRIVE}/files?q=${q}&spaces=drive&fields=files(id)&orderBy=modifiedTime desc`)).json();
  return j.files?.[0]?.id || null;
}
async function uploadAll(){
  const body = JSON.stringify({ app: "maemul", version: 2, savedAt: new Date().toISOString(), items: all });
  if (fileId) {
    await gfetch(`${UPLOAD}/files/${fileId}?uploadType=media`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
  } else {
    const bd = "maemul" + Date.now();
    const meta = { name: FILE, mimeType: "application/json", description: "매물대장 앱 데이터 파일입니다. 직접 수정하거나 이름을 바꾸지 마세요." };
    const multipart = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
    const j = await (await gfetch(`${UPLOAD}/files?uploadType=multipart&fields=id`, { method: "POST", headers: { "Content-Type": `multipart/related; boundary=${bd}` }, body: multipart })).json();
    fileId = j.id;
  }
}
function merge(remote){
  const m = new Map(all.map(x => [x.id, x]));
  for (const r of remote || []) { const l = m.get(r.id); if (!l || (r.updated || 0) > (l.updated || 0)) m.set(r.id, r); }
  const cutoff = Date.now() - 90 * 864e5; // 90일 지난 삭제 표시는 정리
  all = [...m.values()].filter(x => !(x.deleted && x.updated < cutoff));
  live();
}
async function sync(){
  if (!token || syncing) return;
  syncing = true; setSync("동기화 중…");
  const startRev = rev;
  try {
    if (!fileId) fileId = await findFile();
    if (fileId) {
      try { merge((await (await gfetch(`${DRIVE}/files/${fileId}?alt=media`)).json()).items); }
      catch (e) { if (e.notFound) fileId = await findFile(); else throw e; }
    }
    await uploadAll();
    if (rev === startRev) syncedRev = rev; else scheduleSync();
    lastSync = Date.now(); saveLocal(); render(); setSync();
  } catch (e) {
    setSync(e.auth ? "드라이브 연결이 끊겼습니다 · ‘드라이브 연결’을 누르세요" : "동기화 실패 · 변경 내용은 이 기기에 보관 중");
  } finally { syncing = false; }
}

let kakaoReady = null; const geoCache = new Map();
function loadKakao(){
  if (!CONFIG.KAKAO_JS_KEY) return Promise.resolve(false);
  if (kakaoReady) return kakaoReady;
  kakaoReady = new Promise(res => {
    const sc = document.createElement("script");
    sc.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JS_KEY}&libraries=services&autoload=false`;
    sc.onload = () => kakao.maps.load(() => res(true));
    sc.onerror = () => res(false);
    document.head.append(sc);
  });
  return kakaoReady;
}
function geocode(addr){
  if (geoCache.has(addr)) return Promise.resolve(geoCache.get(addr));
  return new Promise(res => new kakao.maps.services.Geocoder().addressSearch(addr, (r, st) => {
    const v = st === kakao.maps.services.Status.OK ? new kakao.maps.LatLng(r[0].y, r[0].x) : null;
    geoCache.set(addr, v); res(v);
  }));
}
function districtToggle(map, btn){
  let on = false;
  btn.onclick = () => { on = !on; on ? map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT) : map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT); btn.setAttribute("aria-pressed", on); };
}

/* ---------- 검색 ---------- */
function filtered(){
  const q = $("#q").value.trim().toLowerCase(), qd = digits(q);
  const t = $("#fType").value, j = $("#fJimok").value, st = $("#fState").value, deal = $("#fDeal").value, src = $("#fSrc").value;
  const k = unit === "py" ? PY : 1;
  const aMin = num($("#aMin").value), aMax = num($("#aMax").value), pMin = num($("#pMin").value), pMax = num($("#pMax").value);
  return items.filter(it => {
    if (t && it.type !== t) return false;
    if (j && !parcels(it).some(p => p.jimok === j)) return false;
    if (st && it.state !== st) return false;
    if (src && (it.src || "own") !== src) return false;
    if (deal === "sale" && it.price == null) return false;
    if (deal === "rent" && it.deposit == null && it.rent == null) return false;
    if (region && regionKey(it.area, regionLevel) !== region) return false;
    const a = totLand(it);
    if (aMin != null && (a == null || a < aMin * k)) return false;
    if (aMax != null && (a == null || a > aMax * k)) return false;
    if (pMin != null && (it.price == null || it.price < pMin)) return false;
    if (pMax != null && (it.price == null || it.price > pMax)) return false;
    if (q) {
      const hay = [it.area, it.owner, it.phone, it.memo, it.zone, it.agName, it.agPhone, it.type,
        ...parcels(it).map(p => `${p.area || ""} ${p.jibun || ""} ${p.jimok || ""}`),
        ...(it.logs || []).map(l => l.who + " " + l.text)].join(" ").toLowerCase();
      const hit = hay.includes(q) || (qd.length >= 3 && (digits(it.phone).includes(qd) || digits(it.agPhone).includes(qd)));
      if (!hit) return false;
    }
    return true;
  }).sort((a, b) => (b.updated || 0) - (a.updated || 0));
}

      <tbody>${rows.map(r => `<tr class="go${r.k === region ? " sel" : ""}" data-region="${esc(r.k)}" tabindex="0">
        <td>${esc(r.k)}</td><td class="n">${r.n}</td><td>${r.types.map(([t, c]) => `${t} ${c}`).join(", ")}</td><td class="n">${r.live}</td><td class="n">${r.rent || ""}</td>

function openForm(it){

/* ---------- 엑셀 ---------- */
const COLS = [["유형","type"],["소재지","area"],["지번","jibun"],["지목","jimok"],["토지면적(㎡)","landM2"],["건물면적(㎡)","bldgM2"],["용도지역","zone"],["매매가(만원)","price"],["보증금(만원)","deposit"],["월임대료(만원)","rent"],["소유자","owner"],["전화번호","phone"],["상태","state"],["출처","src"],["부동산명","agName"],["부동산전화","agPhone"],["층고(m)","height"],["호이스트","hoist"],["수전용량(kW)","power"],["진입로폭(m)","road"],["대형차진입","truck"],["공장등록","reg"],["메모","memo"]];
const NUMS = new Set(["landM2", "bldgM2", "price", "deposit", "rent", "height", "power", "road"]);
const norm = s => String(s).replace(/\s|\(.*?\)/g, "");
const pick = (row, h) => { const key = Object.keys(row).find(c => norm(c) === norm(h)); return key == null ? "" : row[key]; };
$("#impBtn").onclick = () => $("#impFile").click();
$("#impFile").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  if (!window.XLSX) { toast("엑셀 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도하세요"); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer());
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    const extraSheet = wb.Sheets["추가필지"] ? XLSX.utils.sheet_to_json(wb.Sheets["추가필지"], { defval: "" }) : [];
    const added = [];
    for (const row of rows) {
      const it = { id: uid(), logs: [], extra: [], created: Date.now(), updated: Date.now() };
      for (const [h, k] of COLS) { const v = pick(row, h); if (v !== "") it[k] = NUMS.has(k) ? num(String(v).replace(/,/g, "")) : String(v).trim(); }
      if (!it.area && !it.jibun) continue;
      it.type = TYPES.includes(it.type) ? it.type : "토지";
      it.state = ["진행", "보류", "완료"].includes(it.state) ? it.state : "진행";
      it.src = /공동|타|co/.test(it.src || "") ? "co" : "own";
      if (it.jimok && !SYMBOL[it.jimok]) it.jimok = "잡종지";
      added.push(it);
    }
    for (const r of extraSheet) {
      const host = added.find(x => x.area === String(pick(r, "대표소재지")).trim() && x.jibun === String(pick(r, "대표지번")).trim());
      if (!host) continue;
      host.extra.push({ id: uid(), area: String(pick(r, "소재지")).trim(), jibun: String(pick(r, "지번")).trim(), jimok: SYMBOL[pick(r, "지목")] ? pick(r, "지목") : "",
        landM2: num(String(pick(r, "토지면적(㎡)")).replace(/,/g, "")), bldgM2: num(String(pick(r, "건물면적(㎡)")).replace(/,/g, "")) });
    }
    const logSheet = wb.Sheets["상담기록"] ? XLSX.utils.sheet_to_json(wb.Sheets["상담기록"], { defval: "" }) : [];
    for (const r of logSheet) {
      const host = added.find(x => x.area === String(pick(r, "소재지")).trim() && x.jibun === String(pick(r, "지번")).trim());
      const text = String(pick(r, "내용")).trim();
      if (!host || !text) continue;
      host.logs.push({ id: uid(), date: String(pick(r, "상담일")).trim(), who: String(pick(r, "상대")).trim(), offer: num(String(pick(r, "제시가(만원)")).replace(/,/g, "")), next: String(pick(r, "다음연락")).trim(), text });
    }
    for (const it of added) upsert(it);
    if (added.length) afterChange(); toast(added.length ? `${added.length}건을 불러왔습니다` : "불러올 행이 없습니다. 첫 행에 ‘소재지’, ‘지번’ 같은 열 제목이 있는지 확인하세요");
  } catch (err) { toast("파일을 읽지 못했습니다: " + err.message); }
};
$("#expBtn").onclick = async () => {

    "필지수": parcels(it).length, "토지합계(㎡)": totLand(it) ?? "", "건물합계(㎡)": totBldg(it) ?? "" }));

  const logs = items.flatMap(it => (it.logs || []).map(l => ({ 소재지: it.area, 지번: it.jibun, 상담일: l.date, 상대: l.who, "제시가(만원)": l.offer ?? "", 다음연락: l.next, 내용: l.text })));
  const sheet = (arr, blank) => XLSX.utils.json_to_sheet(arr.length ? arr : [blank]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(main), "매물");
  XLSX.utils.book_append_sheet(wb, sheet(extra, { 대표소재지: "", 대표지번: "", 소재지: "", 지번: "", 지목: "", "토지면적(㎡)": "", "건물면적(㎡)": "" }), "추가필지");
  XLSX.utils.book_append_sheet(wb, sheet(logs, { 소재지: "", 지번: "", 상담일: "", 상대: "", "제시가(만원)": "", 다음연락: "", 내용: "" }), "상담기록");
  const data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const filename = `매물대장_${new Date().toISOString().slice(0, 10)}.xlsx`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("엑셀 파일을 내려받았습니다");
};

/* ---------- 이벤트 ---------- */
["q", "fType", "fJimok", "fState", "fDeal", "fSrc", "aMin", "aMax", "pMin", "pMax"].forEach(id => $("#" + id).addEventListener("input", render));
document.querySelectorAll("[data-unit]").forEach(b => b.onclick = () => { unit = b.dataset.unit; document.querySelectorAll("[data-unit]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
$("#reset").onclick = () => { ["q", "aMin", "aMax", "pMin", "pMax"].forEach(id => $("#" + id).value = ""); ["fType", "fJimok", "fState", "fDeal", "fSrc"].forEach(id => $("#" + id).value = ""); region = ""; render(); };
$("#regionClr").onclick = () => { region = ""; render(); };
$("#sumBtn").onclick = () => { view = view === "region" ? "detail" : "region"; render(); if (view === "region") $("#app").classList.add("show-detail"); };
$("#list").addEventListener("click", e => { const b = e.target.closest(".item"); if (!b) return; selected = b.dataset.id; view = "detail"; render(); $("#app").classList.add("show-detail"); $("#right").scrollTop = 0; });
$("#addBtn").onclick = () => openForm();
$("#authBtn").onclick = login;
if (CONFIG.KAKAO_JS_KEY) $("#mapBtn").hidden = false;
$("#mapBtn").onclick = () => { view = view === "map" ? "detail" : "map"; render(); if (view === "map") $("#app").classList.add("show-detail"); };
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
setSync();
render();
</script>
</body>
